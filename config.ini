; QQ 经典农场自动收菜 / 偷菜 配置
; 修改后保存即可，下次启动生效。分号开头的行是注释。

[window]
; 农场小程序窗口标题里包含的文字。不确定就运行：python farm_bot.py --list-windows
title = QQ经典农场
; 每次截图前把窗口调到最前面（窗口被挡住会识别失败，建议保持 true）
activate = true

[run]
; 收自己的菜
do_harvest = true
; 有空地且有种子时自动种菜
do_plant = true
; 自家地里有草 / 虫 / 缺水时点「一键务农」
do_farm = true
; 去好友家偷菜
do_steal = true
; 去好友家帮忙务农（会挨个拜访头像上有小农夫的好友，比较花时间）
do_help = true
; 自动领取每日任务奖励（书本图标上有红色角标时去领）
do_tasks = true
; 到「奶茶热销中」领取收益（收益最多攒 48 小时）
do_milktea = true
; 多少分钟去领一次奶茶店收益
milktea_interval_min = 60
; 被挤下线（账号在其他地方登录）后自动重新登录
relogin = true
; 被挤下线后等几分钟再重新登录（你在手机上玩时可以设成 30，免得把手机挤掉）；0 = 马上登录
relogin_wait_min = 0
; 每轮之间间隔多少分钟，以及随机浮动多少分钟（防止太规律）
round_interval_min = 10
interval_jitter_min = 3
; 休息时段（这段时间不操作），格式 起-止 小时，如 1-7 表示 01:00~07:00；跨天写 23-7；留空不休息
quiet_hours = 
; 每次点击后等待秒数
action_delay = 0.4
; 进入好友农场 / 回家时最多等画面加载多少秒（画面出来就继续，不会每次都等满）
page_load_delay = 2.5
; 每轮最多偷几个好友
max_friends_per_round = 30
; 好友栏最多往后翻几次
max_scroll_pages = 8
; 调试模式：每次识别都把标注过的截图存到 debug 文件夹
debug = false

[match]
; 匹配相似度阈值（0~1）。漏识别就调低，误点就调高
default_threshold = 0.80
; 多尺度匹配的缩放比例。模板就是按现在的窗口大小截的，只用 1.0 最快；
; 如果改过农场窗口大小导致认不出，改成 0.9, 1.0, 1.1（会慢 3 倍）
scales = 1.0
; 也可以按模板单独设置阈值
; 「可摘」气泡是半透明的，分数在 0.63~1.0 之间浮动，所以放低；空地上 0.6 也无误识别
ripe = 0.62
; 「戴墨镜的小手」，和弹窗里的图标长得一样，所以阈值高一些并限定在好友栏里找
friend_steal = 0.85
; 「小农夫」图标，和自家「好友求助」弹窗里的一样，所以也限定在好友栏里找
friend_help = 0.85
; 空地小手是动画，帧间分数 0.77~1.0；没有空地时最高 0.63
empty_plot = 0.75
; 空地块：全空的地 0.9~1.0；播了种子 / 有苗 / 成熟的地最高约 0.5
empty_tile = 0.85
; 「重新连接」和「重新登录」两个绿按钮长得很像（互相能到 0.82），阈值要高才能分开
reconnect = 0.92
relogin = 0.92

[regions]
; 只在窗口某个范围里找某个模板：x0, y0, x1, y1（窗口宽高比例）
friend_steal = 0, 0.83, 1, 0.93
friend_help = 0, 0.83, 1, 0.93

[plant]
; 选哪种种子：most = 数量最多的那种，first = 种子栏里第一个
seed_choice = most
; 关闭种子栏时点击的空白草地位置（窗口宽高比例）
blank_spot = 0.13, 0.71

[friend_bar]
; 好友家底部好友栏：所在范围、往后翻时的拖动起点和终点（窗口宽高比例）
region = 0, 0.83, 1, 0.93
scroll_from = 0.85, 0.88
scroll_to = 0.15, 0.88
